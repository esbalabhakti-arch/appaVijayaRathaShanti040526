<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vijaya Ratha Shanthi Mahotsavam – Family Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet" />

<style>
:root {
  --gold:       #c8922a;
  --gold-light: #e8b84b;
  --gold-pale:  #f5e8c8;
  --crimson:    #8b1a1a;
  --cream:      #fdf8ef;
  --dark:       #1a1008;
  --text:       #2d1f0a;
  --muted:      #7a6040;
  --border:     rgba(200,146,42,0.30);
  --shadow:     0 8px 32px rgba(26,16,8,0.18);
  --shadow-lg:  0 20px 60px rgba(26,16,8,0.28);
  --r:          12px;
  --r-lg:       20px;
  --bar-h:      80px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html  { scroll-behavior: smooth; }
body  { font-family: 'Noto Serif', Georgia, serif; background: var(--cream); color: var(--text); overflow-x: hidden; }

/* ── DEITY BAR ── */
#deity-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: var(--bar-h);
  background: linear-gradient(135deg,#1a0a02 0%,#2d1408 45%,#1a0a02 100%);
  border-bottom: 2px solid var(--gold);
  box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
}
.deity-trio { display:flex; align-items:center; gap:18px; padding:0 18px; }
.deity-frame { display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
.deity-img-wrap {
  width:54px; height:54px; border-radius:50%;
  border:2px solid var(--gold); overflow:hidden; background:#2a1408;
  box-shadow:0 0 14px rgba(200,146,42,0.55); flex-shrink:0;
}
.deity-img-wrap img { width:100%; height:100%; object-fit:cover; object-position:top center; }
.deity-name { font-family:'Noto Sans Tamil',sans-serif; font-size:7.5px; color:var(--gold-light); text-align:center; max-width:62px; line-height:1.3; }
.bar-divider { width:1px; height:46px; background:linear-gradient(to bottom,transparent,var(--gold),transparent); opacity:.45; }
.bar-center { display:flex; flex-direction:column; align-items:center; padding:0 14px; min-width:0; }
.bar-center h1 { font-family:'Cinzel',serif; font-size:clamp(11px,2.2vw,17px); color:var(--gold-light); font-weight:700; letter-spacing:.07em; white-space:nowrap; line-height:1.2; }
.bar-sub { font-size:8.5px; color:rgba(232,184,75,.65); letter-spacing:.12em; text-transform:uppercase; margin-top:2px; }

/* ── NAV TABS ── */
#nav-tabs {
  position:sticky; top:var(--bar-h); z-index:190;
  background:rgba(253,248,239,0.97); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border); box-shadow:0 2px 12px rgba(26,16,8,0.08);
}
.tabs-scroller { display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:0 10px; }
.tabs-scroller::-webkit-scrollbar { display:none; }
.tab-btn {
  display:flex; align-items:center; gap:6px; padding:13px 20px;
  background:none; border:none; border-bottom:3px solid transparent;
  cursor:pointer; font-family:'Noto Serif',serif; font-size:13.5px;
  color:var(--muted); white-space:nowrap; flex-shrink:0;
  transition:color .22s, border-color .22s;
}
.tab-btn:hover  { color:var(--gold); }
.tab-btn.active { color:var(--crimson); border-bottom-color:var(--gold); font-weight:600; }

/* ── PANELS ── */
.section-panel         { display:none; }
.section-panel.active  { display:block; }

/* ── INVITATION PANEL ── */
#panel-invitation {
  min-height:calc(100vh - var(--bar-h) - 46px);
  flex-direction:column; align-items:center; justify-content:flex-start;
  padding:48px 20px 72px;
  background:
    radial-gradient(ellipse at 15% 40%,rgba(139,26,26,0.09) 0%,transparent 55%),
    radial-gradient(ellipse at 85% 60%,rgba(200,146,42,0.08) 0%,transparent 55%),
    linear-gradient(180deg,#fdf3e0 0%,#fdf8ef 100%);
  position:relative; overflow:hidden;
}
#panel-invitation.active { display:flex; }

.inv-eyebrow { font-family:'Cinzel',serif; font-size:clamp(11px,2vw,14px); color:var(--gold); letter-spacing:.18em; text-transform:uppercase; margin-bottom:6px; animation:fadeInDown .8s ease both; }
.inv-title   { font-family:'Cinzel',serif; font-size:clamp(22px,5vw,44px); color:var(--crimson); font-weight:700; text-align:center; letter-spacing:.04em; line-height:1.15; text-shadow:1px 2px 8px rgba(139,26,26,0.12); animation:fadeInDown .8s ease .1s both; }
.inv-tamil   { font-family:'Noto Sans Tamil',sans-serif; font-size:clamp(15px,2.8vw,24px); color:var(--gold); font-weight:600; margin-top:6px; animation:fadeInDown .8s ease .2s both; }
.inv-divider { width:180px; height:2px; background:linear-gradient(to right,transparent,var(--gold),transparent); margin:20px 0; animation:growWidth .8s ease .3s both; }

/* invitation image frame */
.inv-frame-wrap { position:relative; width:100%; max-width:920px; animation:fadeInUp .9s ease .35s both; }
.inv-corner {
  position:absolute; width:26px; height:26px;
  border-color:var(--gold); border-style:solid; opacity:.9;
}
.inv-corner.tl { top:-3px; left:-3px;   border-width:3px 0 0 3px; border-radius:6px 0 0 0; }
.inv-corner.tr { top:-3px; right:-3px;  border-width:3px 3px 0 0; border-radius:0 6px 0 0; }
.inv-corner.bl { bottom:-3px; left:-3px;  border-width:0 0 3px 3px; border-radius:0 0 0 6px; }
.inv-corner.br { bottom:-3px; right:-3px; border-width:0 3px 3px 0; border-radius:0 0 6px 0; }
.inv-image {
  display:block; width:100%; border-radius:var(--r-lg);
  box-shadow:0 16px 64px rgba(26,16,8,0.28), 0 0 0 1px rgba(200,146,42,0.25);
  cursor:zoom-in; transition:transform .3s, box-shadow .3s;
}
.inv-image:hover { transform:scale(1.008); box-shadow:0 24px 80px rgba(26,16,8,0.36), 0 0 0 2px rgba(200,146,42,0.4); }
.inv-caption { margin-top:18px; font-size:13px; color:var(--muted); font-style:italic; letter-spacing:.04em; text-align:center; }

.inv-meta { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:24px; animation:fadeInUp .8s ease .5s both; }
.inv-pill {
  display:flex; align-items:flex-start; gap:8px;
  padding:9px 16px; background:rgba(200,146,42,0.08);
  border:1px solid rgba(200,146,42,0.3); border-radius:40px;
  font-size:13px; color:var(--text); max-width:380px;
}
.inv-pill .pill-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
.inv-pill strong { color:var(--crimson); font-weight:600; }

.scroll-cue {
  margin-top:36px; color:var(--gold); font-size:12px;
  letter-spacing:.1em; text-transform:uppercase; opacity:.7;
  animation:bounce 2s infinite 1.2s;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}

/* ── PHOTO / VIDEO panels ── */
.standard-panel { max-width:1200px; margin:0 auto; padding:48px 16px 80px; }
.section-header { text-align:center; margin-bottom:36px; }
.section-header .s-icon { font-size:28px; display:block; margin-bottom:8px; }
.section-header h2 { font-family:'Cinzel',serif; font-size:clamp(20px,4vw,30px); color:var(--crimson); font-weight:600; letter-spacing:.06em; }
.orn-line { display:flex; align-items:center; gap:10px; max-width:260px; margin:10px auto 0; }
.orn-line::before { content:''; flex:1; height:1px; background:linear-gradient(to right,transparent,var(--gold)); }
.orn-line::after  { content:''; flex:1; height:1px; background:linear-gradient(to left,transparent,var(--gold)); }
.orn-diamond { color:var(--gold); font-size:9px; letter-spacing:5px; }

.photo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; }
.photo-card {
  position:relative; border-radius:var(--r); overflow:hidden;
  background:var(--dark); aspect-ratio:4/3;
  box-shadow:var(--shadow); cursor:pointer;
  transition:transform .3s, box-shadow .3s;
}
.photo-card:hover { transform:translateY(-4px) scale(1.01); box-shadow:var(--shadow-lg); }
.photo-card img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s; }
.photo-card:hover img { transform:scale(1.06); }
.photo-overlay {
  position:absolute; bottom:0; left:0; right:0;
  padding:36px 14px 14px;
  background:linear-gradient(to top,rgba(26,16,8,.85),transparent);
  color:#fff; font-size:13px; font-style:italic;
  opacity:0; transition:opacity .3s; line-height:1.4;
}
.photo-card:hover .photo-overlay { opacity:1; }
.photo-card.placeholder { display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#e8dcc8,#d4c4a0); cursor:default; }
.ph-inner { text-align:center; color:var(--muted); font-size:13px; padding:16px; }
.ph-inner .ph-icon { font-size:34px; opacity:.5; display:block; margin-bottom:8px; }

.video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px; }
.video-card { border-radius:var(--r-lg); overflow:hidden; background:var(--dark); box-shadow:var(--shadow); border:1px solid var(--border); }
.video-card video { width:100%; display:block; max-height:360px; background:#000; }
.video-card.placeholder { aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1a0a02,#2d1408); }
.video-info { padding:14px 16px; background:#fff; border-top:2px solid var(--gold-pale); }
.video-info h3 { font-family:'Cinzel',serif; font-size:15px; color:var(--crimson); margin-bottom:4px; }
.video-info p  { font-size:13px; color:var(--muted); font-style:italic; }

/* ── LIGHTBOX ── */
#lightbox {
  position:fixed; inset:0; z-index:999;
  background:rgba(8,4,0,.96);
  display:none; align-items:center; justify-content:center; padding:14px;
}
#lightbox.open { display:flex; }
.lb-inner { position:relative; max-width:1050px; width:100%; animation:fadeIn .22s ease; }
#lb-img { width:100%; max-height:90vh; object-fit:contain; border-radius:var(--r); box-shadow:0 0 80px rgba(200,146,42,0.2); border:1px solid rgba(200,146,42,0.3); }
#lb-caption { text-align:center; color:var(--gold-light); font-style:italic; margin-top:12px; font-size:15px; }
.lb-close { position:absolute; top:-46px; right:0; background:none; border:2px solid rgba(200,146,42,.5); color:var(--gold-light); width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s; }
.lb-close:hover { background:rgba(200,146,42,.2); }
.lb-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(200,146,42,.15); border:1px solid rgba(200,146,42,.4); color:var(--gold-light); width:44px; height:44px; border-radius:50%; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s; }
.lb-nav:hover { background:rgba(200,146,42,.32); }
#lb-prev { left:-58px; } #lb-next { right:-58px; }

/* ── FOOTER ── */
footer { text-align:center; padding:44px 20px 64px; background:linear-gradient(135deg,#1a0a02,#2d1408); color:var(--gold-light); margin-top:60px; }
footer .ft-om  { font-size:30px; display:block; margin-bottom:12px; }
footer .ft-msg { font-family:'Noto Serif',serif; font-size:15px; color:rgba(232,184,75,.85); max-width:600px; margin:0 auto 16px; line-height:1.8; font-style:italic; }
footer .ft-dots  { color:rgba(200,146,42,.5); font-size:18px; letter-spacing:12px; }
footer .ft-small { font-size:11px; color:rgba(200,146,42,.35); letter-spacing:.12em; margin-top:20px; }

/* ── ANIMATIONS ── */
@keyframes fadeInDown { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeInUp   { from{opacity:0;transform:translateY(18px)}  to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn     { from{opacity:0} to{opacity:1} }
@keyframes growWidth  { from{transform:scaleX(0);opacity:0} to{transform:scaleX(1);opacity:1} }
@keyframes bounce     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(7px)} }

/* ── RESPONSIVE ── */
@media (max-width:768px) {
  :root { --bar-h:66px; }
  .deity-img-wrap { width:44px; height:44px; }
  .deity-trio     { gap:10px; padding:0 10px; }
  .photo-grid     { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
  #lb-prev,#lb-next { display:none; }
}
@media (max-width:420px) {
  .bar-center h1 { font-size:10px; }
  .deity-name    { display:none; }
  .deity-trio    { gap:7px; }
  .inv-pill      { font-size:12px; }
}
</style>
</head>
<body>

<!-- FIXED DEITY BAR -->
<header id="deity-bar">
  <div class="deity-trio">
    <div class="deity-frame">
      <div class="deity-img-wrap"><img id="d-img-0" src="" alt="Mahaperiyava" loading="lazy"/></div>
      <span class="deity-name" id="d-name-0"></span>
    </div>
    <div class="bar-divider"></div>
    <div class="bar-center">
      <h1 id="bar-title">Vijaya Ratha Shanthi</h1>
      <span class="bar-sub">77 · 7 · 7 · Mahotsavam</span>
    </div>
    <div class="bar-divider"></div>
    <div class="deity-frame">
      <div class="deity-img-wrap"><img id="d-img-1" src="" alt="Madurai Veeran" loading="lazy"/></div>
      <span class="deity-name" id="d-name-1"></span>
    </div>
    <div class="bar-divider"></div>
    <div class="deity-frame">
      <div class="deity-img-wrap"><img id="d-img-2" src="" alt="Muthu Mariamman" loading="lazy"/></div>
      <span class="deity-name" id="d-name-2"></span>
    </div>
  </div>
</header>

<!-- STICKY NAV TABS -->
<nav id="nav-tabs">
  <div class="tabs-scroller" id="tabs-scroller"></div>
</nav>

<!-- ══ INVITATION PANEL (first page) ══ -->
<div id="panel-invitation" class="section-panel active">
  <p class="inv-eyebrow">✦ Sacred Family Album ✦</p>
  <h1 class="inv-title" id="inv-main-title">Vijaya Ratha Shanthi Mahotsavam</h1>
  <p class="inv-tamil">விஜய ரத சாந்தி மஹோத்ஸவம்</p>
  <div class="inv-divider"></div>

  <!-- Invitation image with corner ornaments -->
  <div class="inv-frame-wrap" id="inv-frame-wrap">
    <span class="inv-corner tl"></span>
    <span class="inv-corner tr"></span>
    <span class="inv-corner bl"></span>
    <span class="inv-corner br"></span>
    <img id="inv-img" class="inv-image" src="" alt="Invitation" />
  </div>

  <p class="inv-caption" id="inv-caption-text"></p>
  <div class="inv-meta" id="inv-meta"></div>

  <div class="scroll-cue">
    <span>Browse the Album Below</span>
    <span style="font-size:20px">↓</span>
  </div>
</div>

<!-- Photo + Video panels injected here -->
<div id="sections-container"></div>

<!-- LIGHTBOX -->
<div id="lightbox" role="dialog" aria-modal="true">
  <div class="lb-inner">
    <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
    <button class="lb-nav"   id="lb-prev"  aria-label="Previous">‹</button>
    <img id="lb-img" src="" alt="" />
    <button class="lb-nav"   id="lb-next"  aria-label="Next">›</button>
    <p id="lb-caption"></p>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <span class="ft-om">🙏</span>
  <p class="ft-msg" id="ft-msg"></p>
  <div class="ft-dots">✦ ✦ ✦</div>
  <p class="ft-small">With love · Preserved for generations · விஜய ரத சாந்தி</p>
</footer>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var D = ALBUM_DATA;

  /* deity bar */
  D.deities.forEach(function(d, i) {
    var img  = document.getElementById('d-img-' + i);
    var name = document.getElementById('d-name-' + i);
    if (img)  img.src           = d.url;
    if (name) name.textContent  = d.label;
  });
  document.getElementById('bar-title').textContent = D.title;

  /* invitation panel */
  document.getElementById('inv-main-title').textContent = D.title;

  var invImg = document.getElementById('inv-img');
  invImg.src = D.invitationImage || 'media/photos/Invitation_file.png';
  invImg.addEventListener('click', function () {
    openLbSingle(invImg.src, 'Invitation – ' + D.title);
  });
  invImg.addEventListener('error', function () {
    document.getElementById('inv-frame-wrap').style.display = 'none';
  });

  document.getElementById('inv-caption-text').textContent = 'Guest of Honour · ' + D.honoree;

  var metaEl = document.getElementById('inv-meta');
  [
    { icon: '👤', label: 'Celebrating', val: D.honoree },
    { icon: '📅', label: 'Date',        val: D.date    },
    { icon: '📍', label: 'Venue',       val: D.venue   }
  ].forEach(function(p) {
    if (!p.val) return;
    var div = document.createElement('div');
    div.className = 'inv-pill';
    div.innerHTML = '<span class="pill-icon">' + p.icon + '</span><span>' + p.label + ': <strong>' + p.val + '</strong></span>';
    metaEl.appendChild(div);
  });

  document.getElementById('ft-msg').textContent = D.closingMessage;

  /* tabs */
  var tabsScroller = document.getElementById('tabs-scroller');
  var container    = document.getElementById('sections-container');

  addTab('panel-invitation', '📜 Invitation', true);
  D.sections.forEach(function(sec) {
    addTab('panel-' + sec.id, sec.icon + ' ' + sec.title, false);
    buildPhotoPanel(sec);
  });
  if (D.videos && D.videos.length > 0) {
    addTab('panel-videos', '🎬 Videos', false);
    buildVideoPanel();
  }

  function addTab(id, label, active) {
    var btn = document.createElement('button');
    btn.className  = 'tab-btn' + (active ? ' active' : '');
    btn.dataset.id = id;
    btn.innerHTML  = label;
    btn.addEventListener('click', function() { switchTab(id); });
    tabsScroller.appendChild(btn);
  }

  function switchTab(id) {
    document.querySelectorAll('.tab-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.id === id);
    });
    document.getElementById('panel-invitation').classList.toggle('active', id === 'panel-invitation');
    document.querySelectorAll('#sections-container .section-panel').forEach(function(p) {
      p.classList.toggle('active', p.id === id);
    });
    var activeBtn = tabsScroller.querySelector('.tab-btn.active');
    if (activeBtn) activeBtn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }

  /* photos */
  var allPhotos = [];

  function buildPhotoPanel(sec) {
    var panel = document.createElement('div');
    panel.className = 'section-panel';
    panel.id = 'panel-' + sec.id;
    panel.innerHTML =
      '<div class="standard-panel">' +
        '<div class="section-header">' +
          '<span class="s-icon">' + sec.icon + '</span>' +
          '<h2>' + sec.title + '</h2>' +
          '<div class="orn-line"><span class="orn-diamond">◆ ◆ ◆</span></div>' +
        '</div>' +
        '<div class="photo-grid" id="grid-' + sec.id + '"></div>' +
      '</div>';
    container.appendChild(panel);

    var grid = document.getElementById('grid-' + sec.id);
    if (!sec.photos || sec.photos.length === 0) {
      grid.appendChild(makePh('📷', 'Add photos to media/photos/'));
      return;
    }
    sec.photos.forEach(function(ph) {
      var idx = allPhotos.length;
      allPhotos.push(ph);
      var card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = '<img src="' + ph.src + '" alt="' + (ph.caption || sec.title) + '" loading="lazy"/>' +
        (ph.caption ? '<div class="photo-overlay">' + ph.caption + '</div>' : '');
      card.addEventListener('click', function() { openLb(idx); });
      card.querySelector('img').addEventListener('error', function() {
        card.classList.add('placeholder');
        card.innerHTML = '<div class="ph-inner"><span class="ph-icon">📷</span><small>' + ph.src + '</small></div>';
      });
      grid.appendChild(card);
    });
  }

  function buildVideoPanel() {
    var panel = document.createElement('div');
    panel.className = 'section-panel';
    panel.id = 'panel-videos';
    panel.innerHTML =
      '<div class="standard-panel">' +
        '<div class="section-header">' +
          '<span class="s-icon">🎬</span><h2>Videos</h2>' +
          '<div class="orn-line"><span class="orn-diamond">◆ ◆ ◆</span></div>' +
        '</div>' +
        '<div class="video-grid" id="video-grid"></div>' +
      '</div>';
    container.appendChild(panel);

    var grid = document.getElementById('video-grid');
    D.videos.forEach(function(v) {
      var card = document.createElement('div');
      card.className = 'video-card';
      var vid = document.createElement('video');
      vid.controls = true; vid.preload = 'metadata';
      vid.setAttribute('playsinline', '');
      if (v.poster) vid.poster = v.poster;
      vid.src = v.src;
      vid.addEventListener('error', function() {
        card.classList.add('placeholder');
        card.innerHTML = '<div class="ph-inner" style="color:rgba(200,146,42,.6)"><span class="ph-icon">🎬</span><small>' + v.src + '</small></div>';
      });
      var info = document.createElement('div');
      info.className = 'video-info';
      info.innerHTML = '<h3>' + v.title + '</h3>' + (v.caption ? '<p>' + v.caption + '</p>' : '');
      card.appendChild(vid);
      card.appendChild(info);
      grid.appendChild(card);
    });
  }

  function makePh(icon, text) {
    var d = document.createElement('div');
    d.className = 'photo-card placeholder';
    d.innerHTML = '<div class="ph-inner"><span class="ph-icon">' + icon + '</span><span>' + text + '</span></div>';
    return d;
  }

  /* lightbox */
  var curIdx = 0, lbSingle = false;

  function openLb(idx) {
    lbSingle = false; curIdx = idx;
    showLbImg(idx);
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function openLbSingle(src, caption) {
    lbSingle = true;
    document.getElementById('lb-img').src = src;
    document.getElementById('lb-caption').textContent = caption || '';
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLbImg(idx) {
    var ph = allPhotos[idx]; if (!ph) return;
    document.getElementById('lb-img').src = ph.src;
    document.getElementById('lb-caption').textContent = ph.caption || '';
    curIdx = idx;
  }

  function closeLb() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lightbox').addEventListener('click', function(e) { if (e.target === this) closeLb(); });
  document.getElementById('lb-prev').addEventListener('click', function(e) {
    e.stopPropagation();
    if (!lbSingle) showLbImg((curIdx - 1 + allPhotos.length) % allPhotos.length);
  });
  document.getElementById('lb-next').addEventListener('click', function(e) {
    e.stopPropagation();
    if (!lbSingle) showLbImg((curIdx + 1) % allPhotos.length);
  });
  document.addEventListener('keydown', function(e) {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (!lbSingle) {
      if (e.key === 'ArrowLeft')  showLbImg((curIdx - 1 + allPhotos.length) % allPhotos.length);
      if (e.key === 'ArrowRight') showLbImg((curIdx + 1) % allPhotos.length);
    }
  });
  var txStart = 0;
  document.getElementById('lightbox').addEventListener('touchstart', function(e) { txStart = e.touches[0].clientX; }, { passive: true });
  document.getElementById('lightbox').addEventListener('touchend', function(e) {
    if (lbSingle) return;
    var d = txStart - e.changedTouches[0].clientX;
    if (Math.abs(d) > 40) {
      if (d > 0) showLbImg((curIdx + 1) % allPhotos.length);
      else       showLbImg((curIdx - 1 + allPhotos.length) % allPhotos.length);
    }
  });

})();
</script>
</body>
</html>
